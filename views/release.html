<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKELLY - {{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}">
    <meta property="og:type" content="music.song">
    <meta property="og:title" content="SKELLY - {{TITLE}}">
    <meta property="og:description" content="{{DESCRIPTION}}">
    <meta property="og:url" content="{{URL}}">
    <meta property="og:image" content="{{IMAGE}}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="SKELLY - {{TITLE}}">
    <meta name="twitter:image" content="{{IMAGE}}">
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #f5f0e8;
            --fg: #1a1a1a;
            --muted: #888888;
            --light-line: #d0c8b8;
            --font-sans: 'Inter', sans-serif;
            --font-mono: 'Space Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
        }

        .release { width: 100%; max-width: 400px; }

        .label {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .label::before {
            content: '';
            display: inline-block;
            width: 8px; height: 8px;
            background: var(--fg);
            opacity: 0.5;
        }

        .cover {
            width: 100%;
            aspect-ratio: 1;
            border: 1px solid var(--fg);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .cover .placeholder {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            color: var(--muted);
            letter-spacing: 0.1em;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: -0.04em;
            line-height: 1;
            margin-bottom: 8px;
        }

        .meta {
            display: flex;
            justify-content: space-between;
            font-family: var(--font-mono);
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 10px 0;
            border-bottom: 1px solid var(--light-line);
            margin-bottom: 20px;
        }
        .meta .muted { color: var(--muted); font-weight: 400; }

        .countdown {
            font-family: var(--font-mono);
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            margin-bottom: 20px;
        }

        .buttons { display: flex; flex-direction: column; gap: 6px; }
        .buttons a {
            display: flex;
            justify-content: space-between;
            border: 1px solid var(--fg);
            padding: 14px 16px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--fg);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            transition: background 0.15s ease, color 0.15s ease;
        }
        .buttons a:hover { background: var(--fg); color: var(--bg); }

        #embed { margin-top: 20px; display: none; }
        #embed iframe { width: 100%; height: 152px; border: 0; border-radius: 12px; display: block; }

        .back {
            display: inline-block;
            margin-top: 32px;
            font-family: var(--font-mono);
            font-size: 0.6rem;
            font-weight: 700;
            color: var(--fg);
            text-underline-offset: 3px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .back:hover { color: var(--muted); }
    </style>
</head>
<body>

<main class="release">
    <div class="label" id="label">SKELLY // NEW SINGLE</div>
    <div class="cover" id="cover"><span class="placeholder">COVER // SOON</span></div>
    <h1 id="title">{{TITLE}}</h1>
    <div class="meta">
        <span>SKELLY</span>
        <span class="muted" id="date"></span>
    </div>
    <div class="countdown" id="countdown"></div>
    <div class="buttons" id="buttons"></div>
    <div id="embed"></div>
    <a class="back" href="/">&larr; SKELLYVERSE</a>
</main>

<script src="/themes.js"></script>
<script src="/release.js"></script>
<script>
applyTheme(THEMES[getThemeIndex()]);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let wasOut = null;

function render(r, cfg) {
    const left = SkellyRelease.msLeft(r);
    const out = left <= 0;
    document.getElementById('countdown').textContent = out ? 'OUT NOW' : SkellyRelease.countdown(left);
    if (out === wasOut) return;
    wasOut = out;

    // Buttons and player only change when the countdown hits zero
    document.getElementById('label').textContent = out ? 'SKELLY // OUT NOW' : 'SKELLY // NEW SINGLE';
    document.getElementById('buttons').innerHTML = SkellyRelease.buttons(r, cfg).map(b =>
        `<a href="${esc(b.href)}" target="_blank" rel="noopener">${esc(b.label)} <span>&rarr;</span></a>`
    ).join('');

    const track = out && String(r.spotifyUrl || '').match(/open\.spotify\.com\/(?:[a-z-]+\/)?(track|album)\/([a-zA-Z0-9]+)/);
    const embed = document.getElementById('embed');
    if (track) {
        embed.innerHTML = `<iframe src="https://open.spotify.com/embed/${track[1]}/${track[2]}" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>`;
        embed.style.display = 'block';
    }
}

fetch('/api/config').then(res => res.json()).then(cfg => {
    const r = cfg.release;
    document.getElementById('title').textContent = r.title;
    document.getElementById('date').textContent = SkellyRelease.dateLabel(r);
    if (/^\/uploads\//.test(r.coverUrl || '')) {
        const img = document.createElement('img');
        img.src = r.coverUrl;
        img.alt = `${r.title} cover art`;
        document.getElementById('cover').replaceChildren(img);
    }
    render(r, cfg);
    setInterval(() => render(r, cfg), 1000);
}).catch(e => console.error('Failed to load release:', e));
</script>
</body>
</html>
